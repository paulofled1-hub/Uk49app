name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install --no-save sharp @capacitor/assets
      - run: node make-icons.js
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d1b2a'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk UK49-Desbloqueado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uk49-apk
          path: UK49-Desbloqueado.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: UK49 Desbloqueado (ultima versao)
          files: UK49-Desbloqueado.apk
          make_latest: true
