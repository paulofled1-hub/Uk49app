name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p keystore
            cp ~/.android/debug.keystore keystore/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "Chave de assinatura fixa"
            git push
          fi
      - run: npm install
      - run: npm install --no-save sharp @capacitor/assets
      - run: node make-icons.js
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d1b2a'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk UK49-Desbloqueado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uk49-apk
          path: UK49-Desbloqueado.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: UK49 Desbloqueado (ultima versao)
          files: UK49-Desbloqueado.apk
          make_latest: true
