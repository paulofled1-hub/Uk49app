name: Buscar resultados
on:
  schedule:
    - cron: '*/20 10-19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-results.js
      - name: Publicar na branch data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/out
          cp results.json /tmp/out/results.json
          git checkout --orphan data-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/results.json results.json
          git add results.json
          git commit -m "Atualizar resultados"
          git push -f origin data-tmp:data
